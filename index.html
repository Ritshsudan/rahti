<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>راحتي SD</title>
    
    <meta name="theme-color" content="#059669">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style> 
        body { font-family: 'Cairo', sans-serif; background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; } 
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .spinner { border: 3px solid rgba(0,0,0,0.1); width: 24px; height: 24px; border-radius: 50%; border-left-color: #059669; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="pb-20">

    <!-- الشريط العلوي -->
    <header class="bg-white p-4 shadow-sm flex justify-between items-center sticky top-0 z-10">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-emerald-600 rounded-lg text-white flex items-center justify-center font-bold">R</div>
            <h1 class="font-bold text-xl text-gray-800">راحتي SD</h1>
        </div>
        <div class="flex items-center gap-4">
            <span class="text-sm font-semibold text-gray-500" id="lastUpdateTime">جاري التحديث...</span>
            <button onclick="refreshData()" class="text-gray-500 hover:text-emerald-600 transition"><i class="fa-solid fa-rotate-right text-xl"></i></button>
        </div>
    </header>

    <!-- شريط الأخبار -->
    <div class="bg-black text-yellow-500 text-xs py-1 overflow-hidden whitespace-nowrap">
        <div class="animate-pulse inline-block pr-10">عاجل: تحديث أسعار العملات والذهب مباشرة من الأسواق العالمية...</div>
    </div>

    <!-- ================= الصفحة الرئيسية (العملات) ================= -->
    <main id="page-home" class="page active p-4 max-w-md mx-auto space-y-6">
        <!-- الحاسبة -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
            <h2 class="text-gray-500 text-sm mb-4 text-center">حاسبة الدولار (السوق الموازي)</h2>
            <div class="flex flex-col gap-3 relative">
                <div class="bg-gray-50 rounded-xl p-3 border border-gray-200">
                    <label class="text-xs text-gray-400 block mb-1">دولار أمريكي</label>
                    <input type="number" id="usdInput" placeholder="0.00" class="bg-transparent w-full text-2xl font-bold text-gray-800 outline-none text-left" dir="ltr">
                </div>
                <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 bg-white rounded-full p-1 shadow-md z-10">
                    <div class="bg-emerald-100 text-emerald-600 p-2 rounded-full"><i class="fa-solid fa-arrow-down-up-across-line"></i></div>
                </div>
                <div class="bg-gray-50 rounded-xl p-3 border border-gray-200">
                    <label class="text-xs text-gray-400 block mb-1">جنيه سوداني</label>
                    <input type="number" id="sdgInput" placeholder="0.00" class="bg-transparent w-full text-2xl font-bold text-emerald-600 outline-none text-left" dir="ltr">
                </div>
            </div>
            <p class="text-xs text-center text-gray-400 mt-2">سعر الصرف المستخدم: <span id="calcRateDisplay" class="font-bold text-emerald-600">...</span> ج.س</p>
        </div>

        <!-- أسعار العملات -->
        <div class="flex bg-gray-200 rounded-lg p-1">
            <button class="flex-1 bg-white shadow-sm rounded-md py-2 text-sm font-bold text-gray-800">سوق موازي</button>
            <button class="flex-1 py-2 text-sm font-bold text-gray-500">رسمي (البنك)</button>
        </div>
        
        <div id="currencyList" class="space-y-3">
            <div class="spinner"></div>
        </div>
    </main>

    <!-- ================= صفحة الذهب ================= -->
    <main id="page-gold" class="page p-4 max-w-md mx-auto space-y-6">
        <h2 class="text-xl font-bold text-gray-800 mb-4 border-r-4 border-yellow-500 pr-3">أسعار الذهب اليوم</h2>
        
        <div id="goldList" class="space-y-4">
            <div class="spinner"></div>
        </div>
    </main>

    <!-- ================= صفحة المواد الغذائية ================= -->
    <main id="page-food" class="page p-4 max-w-md mx-auto space-y-6">
        <h2 class="text-xl font-bold text-gray-800 mb-4 border-r-4 border-blue-500 pr-3">أسعار المواد الغذائية (استرشادية)</h2>
        <div class="grid grid-cols-2 gap-4">
            <!-- سيتم جلبها من ملف خارجي أو API لاحقاً -->
            <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-100">
                <div class="text-3xl mb-2 text-center">🍬</div>
                <h3 class="font-bold text-gray-800 text-center text-sm">سكر (كرتونة)</h3>
                <p class="text-center font-bold text-blue-600 mt-2" id="sugarPrice">جاري التحديث...</p>
            </div>
            <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-100">
                <div class="text-3xl mb-2 text-center">🌾</div>
                <h3 class="font-bold text-gray-800 text-center text-sm">دقيق (جوال)</h3>
                <p class="text-center font-bold text-blue-600 mt-2" id="flourPrice">جاري التحديث...</p>
            </div>
        </div>
    </main>

    <!-- الشريط السفلي -->
    <nav class="fixed bottom-0 w-full bg-white border-t border-gray-200 flex justify-around py-3 text-gray-400 text-xs font-semibold z-50">
        <button onclick="switchPage('home')" id="nav-home" class="flex flex-col items-center text-emerald-600 transition-colors">
            <i class="fa-solid fa-money-bill-transfer text-xl mb-1"></i> العملات
        </button>
        <button onclick="switchPage('gold')" id="nav-gold" class="flex flex-col items-center hover:text-emerald-600 transition-colors">
            <i class="fa-solid fa-coins text-xl mb-1"></i> الذهب
        </button>
        <button onclick="switchPage('food')" id="nav-food" class="flex flex-col items-center hover:text-emerald-600 transition-colors">
            <i class="fa-solid fa-basket-shopping text-xl mb-1"></i> المواد الغذائية
        </button>
    </nav>

    <!-- الجافاسكريبت -->
    <script>
        // ==========================================
        // 1. الإعدادات الأساسية (ضع مفاتيح API هنا)
        // ==========================================
        const CONFIG = {
            // مفتاح واجهة Apogeo (احصل عليه من موقعهم)
            APOGEO_API_KEY: 'ضع_مفتاح_APOGEO_هنا', 
            // هامش الربح للسوق الموازي (إذا لم تجد API مباشر)
            // مثلاً 15% يعني سعر السوق = السعر الرسمي * 1.15
            PARALLEL_MARKUP: 1.25, 
        };

        // متغيرات عامة لحفظ الأسعار
        let currentUsdRate = 10200; // قيمة افتراضية

        // ==========================================
        // 2. التنقل والحاسبة
        // ==========================================
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            document.querySelectorAll('nav button').forEach(btn => {
                btn.classList.remove('text-emerald-600');
                btn.classList.add('text-gray-400');
            });
            document.getElementById('nav-' + pageId).classList.remove('text-gray-400');
            document.getElementById('nav-' + pageId).classList.add('text-emerald-600');
        }

        const usdInput = document.getElementById('usdInput');
        const sdgInput = document.getElementById('sdgInput');
        const calcRateDisplay = document.getElementById('calcRateDisplay');

        usdInput.addEventListener('input', () => {
            sdgInput.value = usdInput.value ? (usdInput.value * currentUsdRate).toFixed(0) : '';
        });
        sdgInput.addEventListener('input', () => {
            usdInput.value = sdgInput.value ? (sdgInput.value / currentUsdRate).toFixed(2) : '';
        });

        // ==========================================
        // 3. جلب البيانات الحقيقية (API Integration)
        // ==========================================

        async function fetchAllData() {
            document.getElementById('lastUpdateTime').innerText = 'جاري التحديث...';
            
            // أ. جلب سعر الدولار (سأستخدم API مجاني مفتوح هنا كمثال للعمل الفوري)
            // في الإنتاج، استبدله بـ ApogeoAPI
            try {
                // مثال لاستخدام API مجاني (open.er-api.com) لجلب سعر الدولار مقابل الجنيه
                // ملاحظة: هذا قد يعطي السعر الرسمي وليس الموازي
                const response = await fetch('https://open.er-api.com/v6/latest/USD');
                const data = await response.json();
                
                if (data && data.rates && data.rates.SDG) {
                    const officialRate = data.rates.SDG;
                    // محاكاة سعر السوق الموازي (بإضافة هامش)
                    currentUsdRate = Math.round(officialRate * CONFIG.PARALLEL_MARKUP);
                    
                    calcRateDisplay.innerText = currentUsdRate;
                    
                    // تحديث واجهة العملات
                    renderCurrencies(currentUsdRate, officialRate);
                } else {
                    throw new Error('لم يتم العثور على سعر الجنيه السوداني');
                }
            } catch (error) {
                console.error(error);
                // في حالة الفشل، نستخدم أسعار احتياطية
                currentUsdRate = 10200;
                calcRateDisplay.innerText = currentUsdRate;
                renderCurrencies(10200, 8000);
            }

            // ب. جلب سعر الذهب (محاكاة)
            // في الإنتاج، استخدم BullionAPI أو أي API للذهب
            // هنا نفترض أن سعر الأونصة العالمي 2000 دولار
            const goldOunceUSD = 2350; 
            calculateGoldPrices(goldOunceUSD, currentUsdRate);

            // ج. جلب المواد الغذائية (محاكاة أو ملف JSON)
            document.getElementById('sugarPrice').innerText = '18,500 ج.س';
            document.getElementById('flourPrice').innerText = '25,000 ج.س';

            // تحديث وقت التحديث
            const now = new Date();
            document.getElementById('lastUpdateTime').innerText = `تحديث: ${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}`;
        }

        // ==========================================
        // 4. دوال رسم الواجهة (UI Rendering)
        // ==========================================

        function renderCurrencies(parallelRate, officialRate) {
            const currencyList = document.getElementById('currencyList');
            
            // بيانات تجريبية للعملات الأخرى (يجب جلبها من API حقيقي)
            const currencies = [
                { name: 'دولار أمريكي', flag: '🇺🇸', code: 'USD', baseRate: 1 },
                { name: 'ريال سعودي', flag: '🇸🇦', code: 'SAR', baseRate: 0.266 }, // 1 دولار = 3.75 ريال
                { name: 'درهم إماراتي', flag: '🇦🇪', code: 'AED', baseRate: 0.272 }, // 1 دولار = 3.67 درهم
                { name: 'يورو', flag: '🇪🇺', code: 'EUR', baseRate: 1.08 } // 1 يورو = 1.08 دولار
            ];

            currencyList.innerHTML = currencies.map(c => {
                // حساب السعر لكل عملة بناءً على الدولار
                const buyPrice = Math.round(parallelRate * c.baseRate);
                const sellPrice = buyPrice + 50; // هامش بسيط للبيع
                
                return `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border-r-4 border-emerald-500 flex justify-between items-center transition-transform hover:scale-[1.02]">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-gray-50 rounded-full flex items-center justify-center text-xl">${c.flag}</div>
                            <div>
                                <h3 class="font-bold text-gray-800">${c.name}</h3>
                                <p class="text-[10px] text-gray-400">سوق موازي</p>
                            </div>
                        </div>
                        <div class="text-left">
                            <div class="flex gap-4 text-sm mb-1">
                                <div><span class="text-gray-400 text-[10px] block">شراء</span> <span class="font-bold text-gray-800">${buyPrice}</span></div>
                                <div><span class="text-gray-400 text-[10px] block">بيع</span> <span class="font-bold text-gray-800">${sellPrice}</span></div>
                            </div>
                            <div class="text-[10px] text-gray-400 text-left mt-1">رسمي: ${Math.round(officialRate * c.baseRate)}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function calculateGoldPrices(ounceUSD, usdRateSDG) {
            const goldList = document.getElementById('goldList');
            
            // حساب سعر الجرام
            const gramsPerOunce = 31.1035;
            const priceGram24 = (ounceUSD / gramsPerOunce) * usdRateSDG;
            const priceGram21 = priceGram24 * (21 / 24);
            const priceGram18 = priceGram24 * (18 / 24);

            goldList.innerHTML = `
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-yellow-100 relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-20 h-20 bg-yellow-50 rounded-bl-full -z-10"></div>
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-12 h-12 bg-yellow-100 text-yellow-600 rounded-full flex items-center justify-center text-2xl"><i class="fa-solid fa-ring"></i></div>
                        <h3 class="font-bold text-gray-800 text-lg">عيار 21 (الأكثر تداولاً)</h3>
                    </div>
                    <div class="flex justify-between items-end">
                        <div>
                            <p class="text-xs text-gray-400 mb-1">سعر الجرام</p>
                            <p class="text-2xl font-bold text-gray-800">${priceGram21.toLocaleString('en-US', {maximumFractionDigits: 0})} <span class="text-sm font-normal text-gray-500">ج.س</span></p>
                        </div>
                        <div class="text-emerald-500 text-sm font-bold bg-emerald-50 px-2 py-1 rounded">مباشر ⬆️</div>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white p-4 rounded-xl shadow-sm text-center">
                        <p class="text-gray-500 text-sm">عيار 24</p>
                        <p class="font-bold text-lg text-gray-800 mt-1">${priceGram24.toLocaleString('en-US', {maximumFractionDigits: 0})}</p>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow-sm text-center">
                        <p class="text-gray-500 text-sm">عيار 18</p>
                        <p class="font-bold text-lg text-gray-800 mt-1">${priceGram18.toLocaleString('en-US', {maximumFractionDigits: 0})}</p>
                    </div>
                </div>
            `;
        }

        function refreshData() {
            fetchAllData();
        }

        // تشغيل التطبيق
        fetchAllData();

        // تسجيل Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error', err));
            });
        }
    </script>
</body>
</html>
